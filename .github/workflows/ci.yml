name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - mediawiki_version: '1.35'
            php_version: 7.4
            database_type: mysql
            database_image: "mariadb:10"
            coverage: false
            experimental: false
          - mediawiki_version: '1.39'
            php_version: 8.1
            database_type: mysql
            database_image: "mariadb:10"
            coverage: false
            experimental: false
          - mediawiki_version: '1.43'
            php_version: 8.2
            echo_version: REL1_43
            database_type: mysql
            database_image: "mariadb:11.2"
            coverage: true
            experimental: false

    env:
      MW_VERSION: ${{ matrix.mediawiki_version }}
      PHP_VERSION: ${{ matrix.php_version }}
      ECHO_VERSION: ${{ matrix.echo_version }}
      DB_TYPE: ${{ matrix.database_type }}
      DB_IMAGE: ${{ matrix.database_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Update submodules
        run: git submodule update --init --remote

      - name: Run tests
        run: make ci
        if: matrix.coverage == false

      - name: Run tests with coverage
        run: mkdir -p build/coverage && make ci-coverage
        if: matrix.coverage == true

      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: gesinn-it-pub/mediawiki-extensions-CategoryWatch
          files: build/coverage/php/coverage.xml
        if: matrix.coverage == true

      - name: Run Phan static analysis
        run: make install composer-phan
        if: matrix.coverage == true
